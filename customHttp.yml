# Custom HTTP response headers applied by AWS Amplify Hosting.
# See: https://docs.aws.amazon.com/amplify/latest/userguide/custom-headers.html
#
# NOTE: Amplify only applies these on the deployed environment — they cannot be
# verified locally. Confirm live header presence and zero CSP-violation console
# errors on an Amplify preview deploy before the penetration test.
customHeaders:
  - pattern: '**'
    headers:
      - key: 'Strict-Transport-Security'
        value: 'max-age=63072000; includeSubDomains; preload'
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Permissions-Policy'
        value: 'camera=(), microphone=(), geolocation=()'
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.tradeharmonizer.co.uk; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
