version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b ./bin
        - export PATH="$PWD/bin:$PATH"
        - trivy --version
    build:
      commands:
        - export PATH="$PWD/bin:$PATH"
        - npm run build
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
